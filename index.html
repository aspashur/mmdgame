M.push({id:'m12',zone:2,emoji:'🛁',title:'The population bathtub',ch:'Chapter 11 · Population Change',badge:'Change Champion',
cards:[
['➖','Measuring change','Population change is just <b>later size − earlier size</b>. The <b>percent change</b> divides that change by the <b>earlier</b> size and multiplies by 100. Using the earlier size matches the question “how fast did it grow from where it started?” Ghana had 24,658,823 people in 2010 and 30,832,019 in 2021: a change of 6,173,196, or about <b>25.0%</b>.'],
['🚧','Three traps','Be careful to compare like with like. Watch out if (1) the <b>borders</b> of the area changed, (2) the <b>definition</b> of who is counted changed, or (3) the <b>completeness</b> of the count changed.'],
['🚰','Four taps','Only four things change a population: <b>births</b> and <b>immigration</b> (people moving in) add; <b>deaths</b> and <b>emigration</b> (people moving out) subtract. Births minus deaths is <b>natural increase</b>. Immigrants minus emigrants is <b>net migration</b>.'],
['⚖️','The balancing equation','<b>New population = old population + births − deaths + immigrants − emigrants.</b> It works like a bathtub: water in, water out, and the level is the population.']
],
words:[['Natural increase','Births minus deaths. It can be negative, which is called natural decrease.'],['Immigration','People moving into an area from another country.'],['Emigration','People moving out of an area to another country.'],['Net migration','Immigrants minus emigrants.'],['Percent change','Change divided by the earlier size, times 100.']],
act:{title:'Fill and drain the tub',intro:'Set the four taps, then run some years and watch the population level.',type:'bathtub'},
quiz:[{q:'A town grows from 20,000 to 25,000. What is the percent change?',o:['25%','20%','5%','125%'],a:0,w:'Change = 5,000. 5,000 ÷ 20,000 × 100 = 25%.'},{q:'Births 300, deaths 100, immigrants 50, emigrants 150. What is the total change?',o:['+100','+200','−100','+300'],a:0,w:'300 − 100 + 50 − 150 = +100.'},{q:'Which is a reason you cannot compare a town’s size over time directly?',o:['Its borders changed','It got a new mayor','It rained','It is a nice town'],a:0,w:'Changes in territory make counts non-comparable.'},{q:'Ghana grew from 24,658,823 (2010) to 30,832,019 (2021). About what percent change?',o:['25%','6%','20%','125%'],a:0,w:'Change = 6,173,196. 6,173,196 ÷ 24,658,823 × 100 ≈ 25.0%.'}],
take:'You hold the four taps of every population in the world!'});

M.push({id:'m13',zone:2,emoji:'📈',title:'How fast do populations grow?',ch:'Chapter 11 · Population Change (growth patterns)',badge:'Growth Guru',
cards:[
['🪜','Linear: stairs','<b>Linear growth</b> adds the <b>same number</b> of people every year, like climbing steps of equal height.'],
['🐇','Geometric and exponential: rabbits','<b>Geometric</b> growth adds the <b>same percent</b> each year, with the growing total adding more each time (like compound interest). <b>Exponential</b> growth does the same but all the time, not just once a year.'],
['⏱️','Doubling time','How long to double? <b>t = 0.693 ÷ r</b> (r is the yearly rate as a decimal). Brazil’s 1.35% yearly growth between 1991 and 1996 gives 0.693 ÷ 0.0135 ≈ <b>51.4 years</b>. A quick shortcut is 70 ÷ the percent rate. Ghana grew about <b>2.1% a year</b> from 2010 to 2021, its slowest rate on record, so doubling would take about 33 years.'],
['🛑','Limits','No population can grow forever. The <b>logistic curve</b> starts like an exponential, then slows down as it nears a ceiling called the <b>carrying capacity</b>.']
],
words:[['Linear growth','Growth by the same amount in each period.'],['Geometric growth','Growth by the same percent in each period, compounded once per period.'],['Exponential growth','Growth by a constant percent applied continuously.'],['Doubling time','How long a population takes to become twice as big at a steady growth rate.'],['Carrying capacity','The largest population an area can support.']],
act:{title:'Race the lines',intro:'Change the growth rate and watch linear and exponential growth pull apart.',type:'growth'},
quiz:[{q:'At 2% growth per year, about how long to double (rule of 70)?',o:['35 years','70 years','2 years','140 years'],a:0,w:'70 ÷ 2 = 35 years.'},{q:'Which growth adds the SAME number each year?',o:['Linear','Exponential','Logistic','Geometric'],a:0,w:'Linear growth adds a constant amount.'},{q:'What does carrying capacity mean?',o:['The maximum population an area can support','The weight a car can carry','How many babies are born','The speed of growth'],a:0,w:'Logistic growth levels off near the carrying capacity.'},{q:'Ghana’s population grew about 2.1% a year between 2010 and 2021. Using the rule of 70, about how long to double?',o:['About 33 years','About 70 years','About 2 years','About 100 years'],a:0,w:'70 ÷ 2.1 ≈ 33 years.'}],
take:'Growth Guru! You can tell stairs from rabbits and you know when a population will double.'});

M.push({id:'m14',zone:2,emoji:'⚕️',title:'Measuring deaths fairly',ch:'Chapter 12 · Mortality',badge:'Fair Play Statistician',
cards:[
['📄','Where death data come from','Most death numbers come from <b>death certificates</b> in a registration system. If fewer than about 90% of deaths are registered, the numbers must be used carefully.'],
['⚰️','Crude death rate','The <b>crude death rate</b> = deaths in a year ÷ the average (midyear) population × 1,000. It is simple but hides who is dying: older people die more often, so countries with many older people look worse.'],
['🍼','Death rates by age','An <b>age-specific death rate</b> looks at one age group. The <b>infant mortality rate</b> counts deaths of babies under 1 per 1,000 live births. Deaths are also grouped by cause using an international list (the <b>ICD</b>). In Ghana, under-five deaths fell from 155 per 1,000 live births in 1988 to 40 in 2022 (Demographic and Health Survey).'],
['⚖️','Fair comparisons','<b>Age adjustment</b> (standardization) gives two places the same pretend age mix before comparing them. Otherwise, a young town and an old town are not racing on equal terms.']
],
words:[['Crude death rate','Deaths in a year per 1,000 people. It ignores age.'],['Age-specific death rate','Deaths among one age group per 1,000 people of that age.'],['Infant mortality rate','Deaths of babies under age 1 per 1,000 live births.'],['ICD','International Classification of Diseases, a standard list for naming causes of death.'],['Age adjustment','Comparing places as if they had the same mix of ages.']],
act:{title:'The fair race',intro:'Two towns compare their death rates. Is the crude rate fair?',type:'fair'},
quiz:[{q:'Why can the crude death rate be unfair for comparing places?',o:['Older populations have more deaths even if healthcare is great','It uses too many numbers','Babies never die','Rates cannot be compared'],a:0,w:'Crude rates ignore age structure.'},{q:'Infant mortality rate counts deaths of children…',o:['Under 1 year old per 1,000 live births','Under 18','Under 5 per 100','Of all ages'],a:0,w:'It is deaths under age 1 per 1,000 live births.'},{q:'What does age adjustment do?',o:['Gives places the same age mix so they can be compared fairly','Makes people older','Adds more deaths','Removes babies'],a:0,w:'It removes the effect of different age structures.'},{q:'Ghana’s under-five mortality fell from 155 (1988) to 40 (2022) per 1,000 live births. About how many fewer deaths per 1,000?',o:['115','195','40','155'],a:0,w:'155 − 40 = 115 fewer deaths per 1,000 live births.'}],
take:'You can now spot an unfair comparison from a mile away.'});

M.push({id:'m15',zone:2,emoji:'🧓',title:'The life table: 100 babies',ch:'Chapter 13 · The Life Table',badge:'Life Table Legend',
cards:[
['👶','A story of imaginary babies','A <b>life table</b> follows a pretend group of newborns (usually 100,000, called the <b>radix</b>) through life, using the death rates of one period. It shows how many are still alive at each age.'],
['🔤','The columns','<b>q(x)</b>: the chance of dying between ages x and the next age. <b>l(x)</b>: how many are alive at exact age x. <b>d(x)</b>: how many die in that age interval. <b>L(x)</b>: years lived by the group in the interval. <b>T(x)</b>: total years still to be lived after age x. <b>e(x)</b> = T(x) ÷ l(x): <b>life expectancy</b> at age x.'],
['📜','History','John Graunt studied London death records in 1662. In 1693 Edmund Halley built the first real life table, using births and deaths in Breslau (then in Silesia). Insurance companies, doctors and economists all use life tables today.'],
['🇬🇭','Ghana’s babies','A life table starts with babies. In Ghana, <b>40 out of every 1,000</b> babies die before age 5 (2022), down from <b>155</b> in 1988. So about 96 out of 100 babies now reach their fifth birthday.'],
['🧪','Special life tables','A <b>cause-eliminated</b> table asks “How long would we live if a disease disappeared?” <b>Working-life tables</b> follow years in the labor force. <b>Multistate tables</b> follow people moving between statuses. A <b>generation</b> table follows a real group, while a <b>period</b> table uses one year’s rates.']
],
words:[['Life table','A table showing how a group of newborns would shrink with age under certain death rates.'],['Radix','The starting group of babies in a life table, often 100,000.'],['Life expectancy','The average number of years left to live at a given age.'],['q(x)','The chance of dying in an age interval.'],['l(x)','The number still alive at exact age x.']],
act:{title:'Follow 100 babies',intro:'Slide through life and watch the circles. Then compare a modern country to a town long ago.',type:'babies'},
quiz:[{q:'What is a radix in a life table?',o:['The starting group of newborns, like 100,000','The last age','A death rate','The year of the census'],a:0,w:'The radix is the cohort of births that the table follows.'},{q:'e(x) tells you…',o:['Average years of life left at age x','The number of deaths at age x','The year x','How many babies are born'],a:0,w:'e(x) = T(x) ÷ l(x) is life expectancy at age x.'},{q:'Who made the first real life table in 1693?',o:['Edmund Halley','John Snow','Albert Einstein','Dot'],a:0,w:'Halley used births and deaths from Breslau.'},{q:'Ghana’s under-five mortality is 40 per 1,000 births. Of 100 babies, about how many are alive on their fifth birthday?',o:['About 96','About 60','About 40','About 99'],a:0,w:'40 per 1,000 is 4 per 100, so about 96 reach age 5. That is like l(5) in a life table.'}],
take:'You can follow a whole life in a table. That is time travel for numbers!'});

M.push({id:'m16',zone:2,emoji:'🩺',title:'Health beyond deaths',ch:'Chapter 14 · Health Demography',badge:'Health Hero',
cards:[
['🤒','More than dying','Health is not only about death. <b>Morbidity</b> means sickness and <b>disability</b> means difficulty doing everyday things. Surveys and censuses now ask about both.'],
['📊','Incidence and prevalence','<b>Incidence</b> = the number of <b>new</b> cases of an illness in a period. <b>Prevalence</b> = how many people <b>have</b> it at a given time. Long illnesses have high prevalence even when few new cases appear.'],
['❤️','Healthy life expectancy','Life expectancy counts years of life. <b>Healthy (or disability-free) life expectancy</b> counts years lived <b>without</b> disability. Two countries can have the same life expectancy but different healthy years.'],
['🇬🇭','Health differs between groups','In Ghana, 17 of every 1,000 babies die in their <b>first 28 days</b> (neonatal mortality, 2022). Under-5 deaths are about <b>52 per 1,000</b> when mothers have no education but <b>19 per 1,000</b> when mothers have secondary school or more.'],
['👶','Pregnancy and early life','<b>Fetal deaths</b> and <b>perinatal deaths</b> (around the time of birth) are tracked, plus how many women use contraception (<b>contraceptive prevalence</b>). All these help plan clinics and schools.']
],
words:[['Morbidity','Illness or sickness in a population.'],['Incidence','The number of new cases of a condition in a period of time.'],['Prevalence','The number or share of people who have a condition at a given time.'],['Disability','A limit on doing normal activities.'],['Healthy life expectancy','Average years of life lived without disability.']],
act:{title:'The cold in the classroom',intro:'Change how many students catch a cold and how long it lasts.',type:'sick'},
quiz:[{q:'Which counts NEW cases of a disease in a month?',o:['Incidence','Prevalence','Radix','Density'],a:0,w:'Incidence is about new cases.'},{q:'A long-lasting illness will have…',o:['High prevalence even if new cases are few','Zero prevalence','Negative incidence','No effect'],a:0,w:'Prevalence ≈ incidence × duration.'},{q:'What does healthy life expectancy measure?',o:['Years lived without disability','Years in school','Years since a doctor visit','Years of sleep'],a:0,w:'It adds quality to length of life.'},{q:'In Ghana, under-5 mortality is 52 per 1,000 for children of mothers with no education and 19 per 1,000 for mothers with secondary school or more. What does this show?',o:['Health outcomes differ between groups','Everyone is the same','Education has no link to health','Mothers do not matter'],a:0,w:'Demographers compare groups to see where help is needed most.'}],
take:'Health Hero! You know the difference between getting sick and being sick.'});

M.push({id:'m17',zone:2,emoji:'👶',title:'Counting babies',ch:'Chapter 15 · Natality: Measures Based on Vital Statistics',badge:'Birth Whiz',
cards:[
['🍼','Crude birth rate','The <b>crude birth rate</b> = births in a year per 1,000 people. It varies hugely: around 1996 it was roughly 46 to 54 in Ethiopia, Mali and Niger but only about 10 in Germany and Japan.'],
['👩','Rates for women','The <b>general fertility rate</b> counts births per 1,000 <b>women aged 15–49</b>, a better base than everyone. The <b>age-specific birth rate</b> counts births per 1,000 women of one age group.'],
['🧮','The total fertility rate','<b>TFR</b> = sum of the age-specific rates × the width of the age groups (5 years) ÷ 1,000. It means: the average number of children a woman would have if she lived through all her childbearing years at today’s rates. About 2.1 is replacement level.'],
['🇬🇭','Ghana’s fertility story','Ghana’s TFR fell from <b>6.4</b> children per woman in 1988 to <b>3.9</b> in 2022. It differs by place: <b>2.9</b> in Greater Accra but <b>6.6</b> in the North East Region.'],
['🔍','More details','Demographers also look at <b>birth order</b> (first child, second child…), births to married and unmarried women, and compare <b>cohort</b> fertility (a real group of women over time) to <b>period</b> fertility (one year’s snapshot). Standardization can adjust for different age mixes.']
],
words:[['Crude birth rate','Births in a year per 1,000 people.'],['General fertility rate','Births per 1,000 women of childbearing age (15–49).'],['Age-specific birth rate','Births per 1,000 women in one age group.'],['Total fertility rate','Average children per woman if today’s age-specific rates stayed the same through her life.'],['Cohort','A group of people who share a birth year or other starting point.']],
act:{title:'Build a fertility rate',intro:'Move the sliders for each mother’s age group and watch the TFR.',type:'tfr'},
quiz:[{q:'What does TFR stand for?',o:['Total fertility rate','Time for rest','Tall family record','Total fish rate'],a:0,w:'TFR is the total fertility rate.'},{q:'Which is a better base for fertility: all people or women of childbearing age?',o:['Women of childbearing age','All people','Men','Babies'],a:0,w:'The general fertility rate uses women 15–49.'},{q:'About what TFR means a population exactly replaces itself?',o:['About 2.1','About 5','About 0.5','About 10'],a:0,w:'Replacement is a little over 2 children per woman.'},{q:'Ghana’s total fertility rate fell from 6.4 (1988) to 3.9 (2022). What does 3.9 mean?',o:['The average woman would have about 3.9 children in her life at today’s rates','3.9% of women have babies','3.9 babies are born each day','Every woman has exactly 4 children'],a:0,w:'TFR is the average number of children per woman if today’s age-specific rates stayed the same.'}],
take:'You can turn a table of births into one number a woman’s whole life. Neat!'});

M.push({id:'m18',zone:2,emoji:'🧩',title:'Babies from census clues',ch:'Chapter 16 · Natality: Measures Based on Censuses and Surveys',badge:'Birth Detective',
cards:[
['🕳️','When birth records are poor','Many countries do not record every birth. A census or survey can fill the gap by asking women: <b>how many children have you ever had</b> (children ever born), and <b>how many are still alive</b>?'],
['🏠','The own-children method','In a household list, link each child to their <b>mother</b> using relationship answers. The child’s <b>age</b> tells you about <b>when</b> the birth happened, and the mother’s age minus the child’s age tells you how old she was. With many homes you can estimate births in past years.'],
['🇬🇭','Ghana’s questions','Ghana’s 2021 census data include topics such as <b>live births</b> and a <b>summary birth history</b>. The Ghana Demographic and Health Survey also interviews women about all their births.'],
['📖','Birth histories','A <b>birth history</b> asks a woman for the date of each birth. From those, demographers measure <b>parity progression</b>: out of women with one child, how many go on to have a second?'],
['🎯','Rates need exposure','A rate = <b>events ÷ exposure</b> (person-years at risk). Surveys only ask a sample, so results come with a margin of error (confidence interval).']
],
words:[['Children ever born','The number of live births a woman has had over her life so far.'],['Own-children method','Linking children to their mothers in a household list to estimate past births.'],['Parity','The number of children a woman has had.'],['Exposure','The amount of time people were at risk of an event, such as person-years.']],
act:{title:'Match children to mothers',intro:'Use the household list to find each child’s mother.',type:'ownchild'},
quiz:[{q:'What two questions does “children ever born / surviving” use?',o:['How many children ever born, and how many still alive?','How tall and how old?','Where born and where living?','What school and what job?'],a:0,w:'Together they reveal both fertility and child survival.'},{q:'Akosua is 40. Her son Kwame is 10. How old was Akosua at his birth?',o:['30','10','40','50'],a:0,w:'40 − 10 = 30.'},{q:'What is parity?',o:['The number of children a woman has had','A kind of tax','A death rate','A game'],a:0,w:'Parity counts previous births.'},{q:'Which topics did Ghana’s 2021 census data include to learn about fertility?',o:['Live births and a summary birth history','Shoe sizes','Favourite songs','Bus routes'],a:0,w:'Questions on live births and birth history help estimate fertility.'}],
take:'Birth Detective! You can rebuild past births from a list of who lives where.'});

M.push({id:'m19',zone:2,emoji:'🔁',title:'Will a generation replace itself?',ch:'Chapter 17 · Reproductivity',badge:'Replacement Ranger',
cards:[
['🧬','Replacing ourselves','<b>Reproductivity</b> asks: is a group replacing its own numbers across a whole <b>generation</b>, not just in one year? It combines fertility and mortality.'],
['👧','GRR and NRR','The <b>gross reproduction rate (GRR)</b> counts daughters per woman if no girl ever died before the end of childbearing. The <b>net reproduction rate (NRR)</b> includes deaths. If <b>NRR = 1</b>, each generation exactly replaces itself. Below 1 it shrinks, above 1 it grows.'],
['🇬🇭','Is Ghana above replacement?','Replacement fertility is a little over <b>2.1</b> children per woman. Ghana’s TFR was <b>3.9</b> in 2022, well above that, and Ghana’s population grew about 2.1% a year between 2010 and 2021.'],
['⚖️','The stable population','If fertility and mortality stayed the same for a long time, a population would settle into a fixed shape with a constant growth rate called the <b>intrinsic rate</b>. This “stable population” idea helps with estimating and analyzing data.'],
['📌','Simple yearly measures','The <b>crude rate of natural increase</b> = crude birth rate − crude death rate. The <b>vital index</b> = births per 100 deaths. They are easy to compute but do not tell the whole generation story.']
],
words:[['Gross reproduction rate','Daughters a woman would have if no girl died before the end of her childbearing years.'],['Net reproduction rate','Daughters per woman after deaths are counted. 1 means exact replacement.'],['Stable population','A population that would result from fixed fertility and mortality over a long time.'],['Intrinsic rate','The steady growth rate of a stable population.'],['Vital index','Births per 100 deaths.']],
act:{title:'Do the daughters replace the mothers?',intro:'Move the sliders and watch three generations of baby girls.',type:'nrr'},
quiz:[{q:'NRR = 1 means…',o:['Each generation exactly replaces itself','The population doubles','The population vanishes','Nothing about growth'],a:0,w:'An NRR of 1 is exact replacement.'},{q:'Which counts deaths: GRR or NRR?',o:['NRR','GRR','Neither','Both'],a:0,w:'NRR is “net” of deaths.'},{q:'Crude rate of natural increase equals…',o:['Birth rate − death rate','Birth rate + death rate','Deaths ÷ births','Births × deaths'],a:0,w:'Natural increase is births minus deaths.'},{q:'Ghana’s TFR is 3.9 and replacement is about 2.1. Compared with replacement, Ghana’s fertility is…',o:['Above replacement, so each generation is bigger','Below replacement','Exactly replacement','Zero'],a:0,w:'A TFR above about 2.1, with most girls surviving, means each generation is larger.'}],
take:'You can tell if a generation will fill the shoes of the last. Replacement Ranger!'});

M.push({id:'m20',zone:2,emoji:'✈️',title:'Moving between countries',ch:'Chapter 18 · International Migration',badge:'Border Explorer',
cards:[
['🛫','The third factor','Migration is the third basic cause of change, next to births and deaths. It changes the size of both the place people leave and the place they go to, and also who lives there (age, language, jobs).'],
['🔍','Words to know','<b>Immigrants</b> come in, <b>emigrants</b> go out. A <b>flow</b> is people moving during a period. A <b>stock</b> is how many foreign-born people live there at one time. <b>Temporary</b> migrants stay a short time, <b>permanent</b> ones stay. Refugees flee danger. Some migrants are <b>undocumented</b>, which is hard to measure.'],
['🇬🇭','Counting Ghanaians abroad','Ghana’s 2021 census data include separate records for <b>emigrants</b> and for <b>absentees</b>, and the census asks about <b>place of birth</b>. Together these help Ghana see who comes in and who leaves.'],
['📋','Where migration data come from','Border and visa records, population registers, census questions on <b>country of birth</b> and <b>where you lived before</b>, and surveys. No single source is perfect.'],
['🧮','The residual trick','If we know population at the start and end, plus births and deaths, we can find net migration: <b>net migration = (end − start) − (births − deaths)</b>. <b>Net</b> means in minus out. <b>Gross</b> counts all the moves in both directions.']
],
words:[['Flow','The number of people who move during a period of time.'],['Stock','The number of people in a given category at one time, like the foreign-born.'],['Net migration','Immigrants minus emigrants.'],['Gross migration','All moves in and out added together.'],['Nativity','Whether a person was born in the country where they live.']],
act:{title:'The missing movers',intro:'Nobody counted who moved to Tolu Island. Work it out from the other numbers.',type:'residual'},
quiz:[{q:'Start 10,000. End 10,600. Births 500, deaths 200. Net migration?',o:['+300','+600','−300','+100'],a:0,w:'Change 600 − natural increase 300 = +300.'},{q:'What is a “stock” of migrants?',o:['How many foreign-born people live in a place at one time','Moves in one year','A kind of boat','A tax'],a:0,w:'A stock is a count at a moment. A flow is a count of moves.'},{q:'What does “net” migration mean?',o:['Immigrants minus emigrants','Immigrants plus emigrants','Only emigrants','Only immigrants'],a:0,w:'Net is the balance of in and out.'}],
take:'Border Explorer! You can find movers nobody counted.'});

M.push({id:'m21',zone:2,emoji:'🚚',title:'Moving within a country',ch:'Chapter 19 · Internal Migration and Short-Distance Mobility',badge:'Mover Mapper',
cards:[
['🏠','Movers and migrants','<b>Mobility</b> means any move to a new home. <b>Migration</b> means a move that crosses a boundary, such as to another town, region or country. Every migrant is a mover, but not every mover is a migrant.'],
['➡️','In, out, net','For any area: <b>in-migrants</b> arrive, <b>out-migrants</b> leave, and <b>net migration</b> is the difference. A <b>stream</b> is the flow of movers from one place to another.'],
['🎯','Moving is a choice','People who move are not a random sample. Young adults move most. So migration can <b>change a place</b>: Florida’s share of people aged 65+ rose from 8.6% in 1950 to 17.6% in 2000. California’s population became much more diverse between 1970 and 2000.'],
['🇬🇭','Ghana on the move','Between 2010 and 2021 Greater Accra grew from 4,010,054 to <b>5,455,692</b> people (+36%), and almost half (47.8%) of Ghana’s urban growth was in Greater Accra and Ashanti. The Northern Region grew by almost 50%. People moving in from other places is part of the story.'],
['📚','Finding the data','Census questions such as “where did you live five years ago?”, population registers, tax and school records, and surveys. When there is no direct data, demographers estimate with <b>residual</b> and <b>survival-rate</b> methods.']
],
words:[['Mobility','Any change of home address, near or far.'],['Migration','A move that crosses a boundary, such as between towns or countries.'],['In-migration','Moving into an area from another part of the same country.'],['Out-migration','Moving out of an area to another part of the same country.'],['Migration stream','The flow of migrants from one area to another.']],
act:{title:'Mover, internal migrant or international migrant?',intro:'Sort each move.',type:'sort',cfg:{
buckets:[{k:'mover',e:'🏘️',label:'Local mover (same area)'},{k:'int',e:'🚚',label:'Internal migrant'},{k:'abroad',e:'✈️',label:'International migrant'}],
items:[{t:'A family moves from one street to another in the same town',k:'mover',w:'Same town: a local move, not a migration.'},{t:'A family moves from Tamale in the Northern Region to Accra',k:'int',w:'Crosses a regional boundary inside the country.'},{t:'A Ghanaian nurse moves to another country for a new job',k:'abroad',w:'Crossing a national border is international migration.'},{t:'Students move from a village in the Volta Region to Accra to study',k:'int',w:'Different area, same country.'},{t:'Grandparents move to a smaller flat two blocks away',k:'mover',w:'A short move inside the same place.'}]}},
quiz:[{q:'A family moves across town. Are they migrants?',o:['No, they are local movers','Yes, international migrants','They are immigrants','They changed countries'],a:0,w:'Migration crosses a boundary; this stays inside the same area.'},{q:'1,200 people move into a county and 900 move out. Net migration?',o:['+300','+2,100','−300','+900'],a:0,w:'1,200 − 900 = +300.'},{q:'Why do migrants change the make-up of a place?',o:['Movers are often different from those who stay, like younger adults','They never move','They take the population with them','They do not change anything'],a:0,w:'Migration selects certain kinds of people, so composition changes.'},{q:'Greater Accra grew from 4,010,054 (2010) to 5,455,692 (2021). About how many more people?',o:['About 1.45 million','About 5 million','About 4 million','About 145,000'],a:0,w:'5,455,692 − 4,010,054 = 1,445,638. Part of the growth came from people moving in.'}],
take:'Zone 2 done! You know why populations rise, fall and shift. Next: the Crystal Tower, where we guess what we cannot count.'});
})();

M.push({id:'m22',zone:3,emoji:'🔭',title:'Estimating today’s population',ch:'Chapter 20 · Population Estimates',badge:'Estimate Expert',
cards:[
['📅','Three kinds of numbers','An <b>intercensal estimate</b> is for a date <b>between</b> two censuses (filling a gap, called interpolation). A <b>postcensal estimate</b> is for a date <b>after</b> the latest census (reaching forward, called extrapolation). A <b>projection</b> is for the <b>future</b>.'],
['🕵️','Symptomatic data','Between censuses, demographers use <b>clues</b> that “show symptoms” of population change: births, deaths, school enrollment, tax returns, driver licences, electricity hook-ups and <b>housing units</b>.'],
['🧰','Estimation methods','The <b>component method</b> adds births and in-migration and subtracts deaths and out-migration. The <b>housing unit method</b> multiplies homes × share occupied × people per home. <b>Ratio-correlation</b> and <b>composite</b> methods combine several clues.'],
['💵','Why it matters','Governments share money, plan schools and hospitals, and draw voting areas using up-to-date population estimates, even for places that never had a good census. Ghana’s last two censuses were in 2010 and 2021, so numbers for the years between and after need estimates.']
],
words:[['Intercensal estimate','An estimate for a date between two censuses.'],['Postcensal estimate','An estimate for a date after the most recent census.'],['Symptomatic data','Indirect clues, like school enrollment, that change when the population changes.'],['Housing unit method','Estimating population from the number of homes, how many are occupied and how many people live in each.'],['Component method','Estimating population by adding births and in-migration and subtracting deaths and out-migration.']],
act:{title:'Build an estimate from homes',intro:'The census was long ago, but the city kept counting new homes. Use them as a clue.',type:'housing'},
quiz:[{q:'An estimate for the year between two censuses is called…',o:['Intercensal','Postcensal','A projection','A forecast'],a:0,w:'Intercensal estimates lie between two censuses.'},{q:'4,000 homes, 90% occupied, 3 people each. Estimated population?',o:['10,800','12,000','4,000','3,600'],a:0,w:'4,000 × 0.9 × 3 = 10,800.'},{q:'Which is a symptomatic clue for population?',o:['School enrollment','The color of the town hall','The mayor’s name','The weather'],a:0,w:'School enrollment rises and falls with the number of children.'},{q:'Ghana counted its people in 2010 and 2021. An estimate for the year 2015 is called…',o:['Intercensal','Postcensal','A projection','Primary data'],a:0,w:'2015 lies between two censuses, so it is intercensal.'},{q:'An estimate for 2024, after the 2021 census, is called…',o:['Postcensal','Intercensal','A census','Impossible'],a:0,w:'It comes after the latest census, so it is postcensal.'}],
take:'Estimate Expert! You can work out a population without a census.'});

M.push({id:'m23',zone:3,emoji:'🔮',title:'Projecting the future',ch:'Chapter 21 · Population Projections',badge:'Future Forecaster',
cards:[
['🎯','Estimate, projection, forecast','An <b>estimate</b> is for the present or past. A <b>projection</b> is “what happens <b>if</b> these assumptions hold”. A <b>forecast</b> is the projection judged most likely. A projection cannot be proved wrong, but its assumptions can turn out wrong.'],
['📈','Simple extrapolation','Extend recent change with a straight line (linear), a fixed percent (geometric) or continuous growth (exponential). It is quick but ignores why the population is changing.'],
['🧱','Cohort-component method','The favourite method: <b>age each group</b> forward, apply <b>survival</b> rates, add <b>births</b> from women of childbearing age, and add <b>migration</b>. You need assumptions for fertility, mortality and migration.'],
['🇬🇭','Ghana’s fertility question','The big question in projecting Ghana is fertility. It fell from <b>6.4</b> to <b>3.9</b> children per woman between 1988 and 2022. Will it keep falling? Different answers give different futures, so planners compare scenarios.'],
['🔀','Alternative series and accuracy','Agencies publish <b>low, medium and high</b> projections to show the uncertainty. Accuracy is measured with <b>MAPE</b> (mean absolute percent error). Errors are larger for small areas and for longer horizons.']
],
words:[['Projection','A calculation of future population under stated assumptions.'],['Forecast','The projection thought most likely to come true.'],['Cohort-component method','A projection method that ages each age group and adds births, deaths and migration.'],['Alternative series','Low, medium and high versions of a projection using different assumptions.'],['MAPE','Mean absolute percent error, a way to measure how far off projections were.']],
act:{title:'Run the projection machine',intro:'Set the fertility, survival and migration assumptions and watch the future change.',type:'project'},
quiz:[{q:'Why do agencies publish low, medium and high series?',o:['The future is uncertain, so assumptions differ','They like three numbers','They cannot add','To confuse people'],a:0,w:'Different assumptions give different outcomes, showing the range.'},{q:'In the cohort-component method, what happens to each age group?',o:['It moves to the next age group after survival and migration','It disappears','It doubles','It is ignored'],a:0,w:'Groups age forward with survival and migration applied.'},{q:'What is the difference between a projection and a forecast?',o:['A forecast is the projection judged most likely','They are the same','A forecast is always wrong','A projection is a past number'],a:0,w:'All forecasts are projections but not all projections are forecasts.'},{q:'Ghana’s fertility fell from 6.4 to 3.9. If fertility keeps falling, what happens to projections of future population?',o:['It grows more slowly','It grows faster','Nothing changes','It stops today'],a:0,w:'Lower fertility assumptions give slower projected growth.'}],
take:'Future Forecaster! You know that a projection is a map of “what if”.'});

M.push({id:'m24',zone:3,emoji:'🧰',title:'Tricks for places with few records',ch:'Chapter 22 · Some Methods of Estimation for Statistically Underdeveloped Areas',badge:'Clue Cracker',
cards:[
['📦','Stocks and flows','<b>Stock data</b> are counts of people at one time (from a census). <b>Flow data</b> are counts of events during a period (births, deaths, moves). Places with weak records may have only one kind, or lower quality.'],
['🧩','Indirect estimation','When direct numbers are missing, demographers use <b>indirect techniques</b>. For example, the <b>age structure</b> of a population holds hints about past births and deaths. A very young population hints at high fertility.'],
['🇬🇭','Surveys fill gaps','Ghana uses big household surveys such as the <b>Demographic and Health Survey</b> (2022 was the seventh since 1988) to measure fertility and child deaths: a TFR of 3.9 and 40 under-five deaths per 1,000 births.'],
['📐','Model life tables and stable populations','Demographers keep libraries of <b>model life tables</b> (typical mortality patterns) and <b>model stable populations</b>. They compare a place’s limited data with these models to find the best fit.'],
['👩‍👧','Children ever born and surviving','William Brass’s method uses mothers’ answers about children ever born and children still alive to estimate child mortality. <b>Reverse survival</b> works backwards: take children aged 0–4 and “un-die” them to estimate recent births. Always cross-check with more than one method.']
],
words:[['Stock data','Counts of people at one point in time.'],['Flow data','Counts of events like births, deaths or moves over a period.'],['Indirect estimation','Estimating something from related clues because it was not measured directly.'],['Model life table','A typical pattern of death rates at each age, used to fill in missing data.'],['Reverse survival','Working backwards from the number of children to estimate births.']],
act:{title:'The Brass trick',intro:'Use two questions asked of mothers to learn about child deaths.',type:'brass'},
quiz:[{q:'Which is a FLOW?',o:['Births in a year','Number of people on census day','Houses in a town','Schools in a region'],a:0,w:'A flow counts events over a period.'},{q:'The Brass method starts from…',o:['Children ever born and children still alive','Rainfall','The price of rice','The number of shoes'],a:0,w:'It uses proportions of children who have died by mother’s age group.'},{q:'Why compare data to model tables?',o:['To borrow a good pattern when real data are partial','To make things longer','To avoid counting','To make pretty charts'],a:0,w:'Model tables fill gaps with realistic patterns.'},{q:'The Ghana Demographic and Health Survey asks mothers about their births. Why?',o:['To estimate fertility and child deaths from a sample','To count shoes','To measure rainfall','To find rivers'],a:0,w:'Surveys with birth questions give fertility and child mortality estimates.'}],
take:'Zone 3 done! You can estimate, project and use clever clues. Last stop: the Toolbox!'});

M.push({id:'m25',zone:4,emoji:'📊',title:'Shortcut tables and model patterns',ch:'Appendix A and Appendix B',badge:'Table Tinkerer',
cards:[
['📋','Appendix A: a shortcut','An <b>abridged life table</b> uses 5-year age groups instead of single years. The <b>Reed–Merrell method</b> gives reference tables so you can build one from simple death rates without a mountain of arithmetic.'],
['📚','Appendix B: model tables','<b>Model life tables</b> collect typical survival patterns, grouped into <b>families</b> (such as West, North, East and South). Each family has many <b>levels</b>, from short lives to long lives.'],
['🧮','Stable population tables','These link the birth rate, the death pattern and the growth rate, so one known number can help find the others.'],
['🧑‍🔧','When to use them','When a country has missing or doubtful records, demographers match a few known numbers (like deaths among children) to the closest model to estimate the rest.']
],
words:[['Abridged life table','A life table that uses age groups (like 5 years) instead of single years.'],['Reed–Merrell method','A shortcut recipe for building an abridged life table.'],['Model life table family','A set of life tables that share a typical pattern of deaths by age.'],['Level (of a model)','How high or low life expectancy is within a family.']],
act:{title:'Match the town to the curve',intro:'Three survival patterns, three mystery towns. Which curve is whose?',type:'curves'},
quiz:[{q:'Why is an abridged life table “abridged”?',o:['It uses age groups instead of single years','It is on a short page','It is secret','It lists only men'],a:0,w:'Abridged tables use ranges like 5-year groups.'},{q:'What is a model life table family?',o:['A group of tables sharing a typical mortality pattern','A group of relatives','A family tree','A school class'],a:0,w:'Families such as West, North, East and South describe typical patterns.'},{q:'When do demographers use model tables?',o:['When local data are missing or unreliable','Never','Only for fun','When they have perfect data'],a:0,w:'They borrow a realistic pattern to fill gaps.'}],
take:'Table Tinkerer! You know how to borrow a pattern when data go missing.'});

M.push({id:'m26',zone:4,emoji:'🧪',title:'The maths toolbox',ch:'Appendix C · Selected General Methods',badge:'Math Wizard',
cards:[
['🫘','Sampling','A few measurements taken <b>well</b> can tell you more than many taken <b>badly</b>. Sampling saves time and money, but it comes with <b>sampling error</b> (luck of the draw) and <b>non-sampling error</b> (like wrong answers or missing people).'],
['📏','Filling gaps and fitting curves','<b>Interpolation</b> fills in values between known points. <b>Curve fitting</b> finds a smooth rule that matches the data, so patterns can be described in a few numbers.'],
['🎛️','Adjusting to known totals','When two sources disagree, demographers adjust one table so its rows and columns add to totals they trust (iterative proportional fitting, or “raking”).'],
['💻','Computers and big models','Matrix methods, <b>microsimulation</b> (simulating many individual people), system dynamics models and <b>administrative record databases</b> are modern tools. Computers make them fast.']
],
words:[['Sampling error','Differences between a sample result and the true value because of chance.'],['Non-sampling error','Mistakes that come from anything other than chance, like wrong answers.'],['Interpolation','Estimating a value between two known values.'],['Curve fitting','Finding a smooth mathematical line that follows the data.'],['Microsimulation','A computer model that follows many individual people through life events.']],
act:{title:'Two toolbox tricks',intro:'First scoop beans to see sampling at work. Then fill a gap between two censuses.',type:'toolbox'},
quiz:[{q:'Which sample should be steadier?',o:['A bigger sample','A smaller sample','They are the same','Neither'],a:0,w:'Larger samples vary less from the true value.'},{q:'What is interpolation?',o:['Estimating between known values','Predicting the far future','Counting beans','Deleting data'],a:0,w:'Interpolation fills in values inside the known range.'},{q:'What is microsimulation?',o:['A computer model of many individual people','A tiny microscope','A small census','A short quiz'],a:0,w:'It follows many simulated people through life events.'},{q:'Ghana had 24,658,823 people in 2010 and 30,832,019 in 2021. What is the straight-line guess halfway between?',o:['About 27.7 million','About 24.7 million','About 30.8 million','About 55 million'],a:0,w:'(24,658,823 + 30,832,019) ÷ 2 ≈ 27,745,421.'}],
take:'Math Wizard! Samples, gap-filling and computer models are now in your pocket.'});

M.push({id:'m27',zone:4,emoji:'🧭',title:'Maps that think (GIS)',ch:'Appendix D · Geographic Information Systems',badge:'Map Wizard',
cards:[
['🧱','Layers of a map','A <b>GIS</b> (Geographic Information System) stores a map as <b>layers</b>. <b>Points</b> are things like homes or pumps, <b>lines</b> are roads or rivers, <b>polygons</b> are areas like towns. You switch layers on and off to ask questions.'],
['💧','Snow and the pump','In 1854, Dr. John Snow mapped cholera cases and water wells in London. The cases clustered around one pump. Closing it helped stop the outbreak. It is one of the first times a map shaped public policy.'],
['🏛️','Census maps','In the late 1960s, the US Census Bureau tested digital address and street files (including a test in New Haven in 1967). Making maps into numbers was the start of modern GIS.'],
['🇬🇭','Ghana’s map in polygons','Ghana’s <b>16 regions</b> and <b>261 districts</b> are polygons on a map. A thematic map of the 2021 census shows big differences even inside Greater Accra: crowded Ablekuma Central has about 17,000 people per km², while Ada West has about 230.'],
['🎨','Thematic maps','A <b>thematic map</b> colors areas by a topic, such as percent population change. GIS also turns addresses into points on a map (geocoding), which is powerful and raises <b>privacy</b> questions.']
],
words:[['GIS','A computer system for storing, mapping and analyzing information tied to places.'],['Layer','One set of map features, like roads or homes, that can be shown or hidden.'],['Thematic map','A map that shows a topic, such as population change, with colors.'],['Geocoding','Turning an address into a point on a map.']],
act:{title:'Be Dr. Snow',intro:'Turn layers on and off and find the pump that spread the sickness.',type:'snow'},
quiz:[{q:'On a GIS map, a home is usually shown as a…',o:['Point','Line','Polygon','Song'],a:0,w:'Homes are points, roads are lines, towns are polygons.'},{q:'What did John Snow’s map show?',o:['Sick homes clustered around one pump','The tallest buildings','Where roads were','The weather'],a:0,w:'The cluster pointed to one contaminated pump.'},{q:'What is a thematic map?',o:['A map that colors places by a topic','A map of Atlantis','A treasure map','A map of the sky'],a:0,w:'It shows a topic such as percent change.'},{q:'Ghana has 16 regions and 261 districts. On a GIS map these areas are drawn as…',o:['Polygons','Points','Lines','Songs'],a:0,w:'Areas such as regions and districts are polygons.'}],
take:'Map Wizard! You can layer maps to solve a mystery.'});

M.push({id:'m28',zone:4,emoji:'⏳',title:'The time machine and the glossary gym',ch:'Glossary and A Demography Time Line',badge:'Junior Demographer',
cards:[
['📜','Long ago','In 1662 John Graunt studied London’s “Bills of Mortality”. In 1693 Edmund Halley built the first real life table, using Breslau records. Censuses became regular in places like England and France starting in 1801.'],
['🗺️','Names and maps','In 1854 John Snow mapped cholera. In 1855 Achille Guillard coined the word <b>“démographie”</b>, which became <b>demography</b>.'],
['💻','Machines and sampling','In 1890 the US census was tabulated with punched cards and electricity (Herman Hollerith), a step toward computers. In 1900 Norway first used sampling in a national census.'],
['🇬🇭','Ghana counts','Ghana’s post-independence censuses counted <b>6.7 million</b> people in 1960, <b>8.6 million</b> in 1970, <b>12.3 million</b> in 1984, <b>18.9 million</b> in 2000, <b>24.7 million</b> in 2010 and <b>30.8 million</b> in 2021.'],
['🌍','Modern times','In 1960 the contraceptive pill was approved in the United States, and fertility patterns changed in many countries. Today computers, surveys, maps and models work together. You now know the main ideas behind all of it!']
],
