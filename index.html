<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Population Explorers: Ghana edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1FF; --dots:rgba(123,92,255,.20); --card:#FFFFFF; --text:#1D1B4B; --muted:#55538A;
  --line:#1D1B4B; --on-bright:#1D1B4B;
  --sun:#FFC93C; --mint:#2EC4A6; --berry:#FF5A87; --sky:#3DA5FF; --grape:#7B5CFF;
  --good:#16A34A; --bad:#E11D48; --soft:#F5F3FF;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14123A; --dots:rgba(185,183,240,.12); --card:#23206B; --text:#F2F1FF; --muted:#B9B7F0;
    --line:#080720; --soft:#2E2A82; --good:#4ADE80; --bad:#FB7185;
  }
}
:root[data-theme="dark"]{
  --bg:#14123A; --dots:rgba(185,183,240,.12); --card:#23206B; --text:#F2F1FF; --muted:#B9B7F0;
  --line:#080720; --soft:#2E2A82; --good:#4ADE80; --bad:#FB7185;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600;font-size:17px;line-height:1.55;
  color:var(--text);background-color:var(--bg);
  background-image:radial-gradient(circle,var(--dots) 1.6px,transparent 1.8px);background-size:24px 24px}
h1,h2,h3,h4{font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;font-weight:800;line-height:1.1;margin:0 0 .4em}
h1{font-size:clamp(2rem,6vw,3.2rem)} h2{font-size:clamp(1.5rem,4vw,2rem)} h3{font-size:1.25rem}
p{margin:.4em 0 .8em}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--grape);outline-offset:3px;border-radius:10px}
.app{max-width:980px;margin:0 auto;padding:0 16px 56px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 -16px 18px;padding:10px 16px;
  background:var(--bg);border-bottom:3px solid var(--line);display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.15rem;cursor:pointer;background:none;border:0;padding:0}
.stats{margin-left:auto;display:flex;align-items:center;gap:10px;font-family:'Baloo 2',sans-serif;font-weight:800}
.meter{width:96px;height:14px;border:3px solid var(--line);border-radius:99px;background:var(--card);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--mint);width:0;transition:width .5s}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border:3px solid var(--line);border-radius:99px;background:var(--sun);color:var(--on-bright)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin:8px 0 28px}
.hero .bubble{position:relative}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;box-shadow:5px 5px 0 var(--line);padding:20px}
.bubble{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:16px 20px;box-shadow:5px 5px 0 var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;background:var(--sun);color:var(--on-bright);
  border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line);padding:.55em 1.15em;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.05rem;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.alt{background:var(--card);color:var(--text)}
.btn.mint{background:var(--mint)} .btn.sky{background:var(--sky)} .btn.berry{background:var(--berry)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.zone{margin:0 0 34px}
.zonehead{display:flex;gap:14px;align-items:center;background:var(--z);color:var(--on-bright);border:3px solid var(--line);border-radius:20px 20px 0 0;padding:14px 18px;box-shadow:5px 0 0 var(--line)}
.zonehead .ze{font-size:2.2rem}
.zonehead h2{margin:0}
.zonehead p{margin:0;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;background:var(--card);border:3px solid var(--line);border-top:0;border-radius:0 0 20px 20px;padding:16px;box-shadow:5px 5px 0 var(--line)}
.tile{position:relative;text-align:left;cursor:pointer;background:var(--soft);border:3px solid var(--line);border-radius:16px;padding:14px 12px 12px;min-height:150px;display:flex;flex-direction:column;gap:4px;transition:transform .1s}
.tile:hover{transform:translateY(-3px) rotate(-.6deg)}
.tile .te{font-size:2rem;line-height:1}
.tile .tn{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--z);color:var(--on-bright);border:3px solid var(--line);display:grid;place-items:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:.85rem}
.tile .tt{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.05rem;line-height:1.15;margin-top:4px}
.tile .tc{font-size:.8rem;color:var(--muted);font-weight:700}
.tile .ts{margin-top:auto;font-size:1.05rem;letter-spacing:1px}
.tile.next{border-color:var(--berry);animation:pulse 1.8s ease-in-out infinite}
.tile.next::after{content:"Next up!";position:absolute;left:10px;bottom:-12px;background:var(--berry);color:#fff;border:3px solid var(--line);border-radius:99px;padding:0 10px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:.85rem}
.tile.done{background:var(--card)}
.crumb{display:flex;align-items:center;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
.crumb .meta{color:var(--muted);font-weight:800}
.stepper{display:flex;gap:8px;margin:10px 0 18px;flex-wrap:wrap}
.step{padding:4px 14px;border:3px solid var(--line);border-radius:99px;background:var(--card);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:.95rem;color:var(--muted)}
.step.on{background:var(--grape);color:#fff}
.step.ok{background:var(--mint);color:var(--on-bright)}
.slide{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.slide .big{font-size:3.4rem;line-height:1;background:var(--z,var(--sun));border:3px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:3px 3px 0 var(--line);color:var(--on-bright)}
.slide h3{font-size:1.5rem}
.slide p{font-size:1.08rem}
.booktag{display:inline-block;font-size:.82rem;font-weight:800;color:var(--muted);border:2px dashed var(--muted);border-radius:99px;padding:0 10px;margin-bottom:6px}
.dotsline{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}
.dotsline i{width:12px;height:12px;border-radius:50%;border:3px solid var(--line);background:var(--card)}
.dotsline i.on{background:var(--berry)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.words details{border:3px solid var(--line);border-radius:14px;background:var(--soft);margin:8px 0;padding:6px 14px}
.words summary{cursor:pointer;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.1rem}
.words details[open]{background:var(--card)}
.panel{background:var(--soft);border:3px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.panel h4{margin-bottom:.2em}
.say{display:flex;gap:12px;align-items:flex-start;margin:6px 0 12px}
.say .bubble{padding:10px 14px;box-shadow:3px 3px 0 var(--line);font-size:1rem}
.fb{min-height:1.6em;font-weight:800;margin:8px 0}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.sortcard{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.3rem;line-height:1.25;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:18px;text-align:center;box-shadow:4px 4px 0 var(--line);margin:8px 0 14px}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bucket{cursor:pointer;background:var(--sun);color:var(--on-bright);border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line);padding:10px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.02rem;line-height:1.15}
.bucket:nth-child(2){background:var(--mint)} .bucket:nth-child(3){background:var(--sky)} .bucket:nth-child(4){background:var(--berry)}
.bucket:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.bucket .be{display:block;font-size:1.6rem}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.chip{cursor:pointer;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:8px 14px;box-shadow:0 3px 0 var(--line);font-weight:800;text-align:left}
.orderlist{margin:10px 0;padding-left:0;list-style:none;counter-reset:o}
.orderlist li{counter-increment:o;background:var(--mint);color:var(--on-bright);border:3px solid var(--line);border-radius:12px;padding:6px 12px;margin:6px 0;font-weight:800}
.orderlist li::before{content:counter(o) ". ";font-family:'Baloo 2',sans-serif}
.ctrl{display:grid;grid-template-columns:minmax(120px,1.1fr) 2fr 70px;gap:10px;align-items:center;margin:6px 0}
.ctrl label{font-weight:800}
.ctrl output{font-family:'Baloo 2',sans-serif;font-weight:800;text-align:right}
input[type=range]{width:100%;accent-color:var(--grape);height:28px}
input[type=number],input[type=text]{font:inherit;font-weight:800;padding:8px 12px;border:3px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);width:100%;max-width:240px}
.readout{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.readout .r{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:6px 14px;box-shadow:3px 3px 0 var(--line)}
.readout .r b{font-family:'Baloo 2',sans-serif;font-size:1.4rem;display:block;line-height:1.1}
.readout .r span{font-size:.82rem;color:var(--muted);font-weight:800}
.chart{width:100%;height:auto;display:block;background:var(--card);border:3px solid var(--line);border-radius:14px}
.chart text{fill:var(--text);font-family:'Nunito',sans-serif;font-weight:800}
.toggle{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.toggle .btn{font-size:.95rem;padding:.35em .9em}
.toggle .btn.on{background:var(--grape);color:#fff}
.q h3{font-size:1.4rem}
.opts{display:grid;gap:10px;margin:12px 0}
.opt{cursor:pointer;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line);padding:12px 16px;font-weight:800}
.opt:hover{background:var(--soft)}
.opt.right{background:var(--mint);color:var(--on-bright)}
.opt.wrong{background:var(--berry);color:#fff}
.win{text-align:center}
.badge{display:inline-grid;place-items:center;width:150px;height:150px;border-radius:50%;background:var(--sun);color:var(--on-bright);border:4px solid var(--line);box-shadow:6px 6px 0 var(--line);font-size:3.6rem;margin:6px auto 10px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2) rotate(-30deg)}}
.stars{font-size:2.2rem;letter-spacing:4px}
.cert{background:var(--card);border:6px double var(--line);border-radius:12px;padding:30px;text-align:center}
.cert h1{font-size:clamp(1.8rem,5vw,2.6rem)}
.foot{margin-top:30px;text-align:center;color:var(--muted);font-size:.9rem}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-weight:800}
.grid10{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:420px;margin:8px 0}
.grid10 i{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--mint)}
.grid10 i.x{background:transparent;opacity:.35}
.grid10 i.s{background:var(--berry)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tbl{border-collapse:collapse;width:100%;font-size:.95rem}
.tbl th,.tbl td{border:2px solid var(--line);padding:4px 8px;text-align:center}
.tbl th{background:var(--soft);font-family:'Baloo 2',sans-serif}
.person{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--line);border-radius:99px;padding:2px 12px;background:var(--card);margin:3px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.noscript{padding:24px;font-weight:800}
@media (max-width:640px){
  body{font-size:16px}
  .hero{grid-template-columns:1fr;text-align:center;justify-items:center}
  .slide{grid-template-columns:1fr}
  .ctrl{grid-template-columns:1fr 60px}
  .ctrl input{grid-column:1/-1;grid-row:2}
  .twocol{grid-template-columns:1fr}
  .meter{width:60px}
  .brand span.t{display:none}
}
@media print{
  .topbar,.nav,.btn,.foot,.noprint{display:none!important}
  body{background:#fff}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app" class="app"><noscript><p class="noscript">This course needs JavaScript to run. Please turn it on and reload.</p></noscript></div>
<script>
(function(){
'use strict';
const PE=window.PE={missions:[],acts:{},zones:[
 {k:1,e:'🏝️',n:'Counting Island',d:'How many of us are there, where do we live, and what are we like?',c:'var(--sky)'},
 {k:2,e:'🌊',n:'Change River',d:'Births, deaths and moving house: why the number of people keeps changing.',c:'var(--mint)'},
 {k:3,e:'🔮',n:'Crystal Tower',d:'What do you do when you cannot count everyone? Guess like a pro!',c:'var(--grape)'},
 {k:4,e:'🧰',n:'Toolbox Cove',d:'Shortcuts, maps, maths tricks and the story of demography.',c:'var(--sun)'}
]};
const NS='http://www.w3.org/2000/svg';
PE.el=function(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)e.setAttribute(k,v);}
  for(const c of kids.flat(2)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  return e;
};
PE.sv=function(tag,attrs,...kids){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs||{})e.setAttribute(k,attrs[k]);
  for(const c of kids.flat(2)){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  return e;
};
const el=PE.el;
PE.rng=function(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};};
PE.shuffle=function(a,r){r=r||Math.random;a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
PE.fmt=function(n,d){return Number(n).toLocaleString('en-US',{maximumFractionDigits:d==null?0:d,minimumFractionDigits:d||0});};
PE.slider=function(parent,o){
  const out=el('output',null,'');
  const inp=el('input',{type:'range',min:o.min,max:o.max,step:o.step||1,value:o.value,'aria-label':o.label});
  const show=()=>{out.textContent=(o.pre||'')+PE.fmt(inp.value,o.dec||0)+(o.suf||'');};
  inp.addEventListener('input',()=>{show();o.on&&o.on(+inp.value);});
  show();
  parent.append(el('div',{class:'ctrl'},el('label',null,o.label),inp,out));
  return {get:()=>+inp.value,set:v=>{inp.value=v;show();},inp};
};
PE.dot=function(size,mood){
  size=size||72;
  const s=PE.sv('svg',{viewBox:'0 0 100 100',width:size,height:size,role:'img','aria-label':'Dot the demographer'});
  s.append(PE.sv('circle',{cx:50,cy:54,r:40,fill:'#FFC93C',stroke:'#1D1B4B','stroke-width':5}));
  s.append(PE.sv('circle',{cx:36,cy:46,r:6,fill:'#1D1B4B'}),PE.sv('circle',{cx:64,cy:46,r:6,fill:'#1D1B4B'}));
  s.append(PE.sv('circle',{cx:38,cy:44,r:2,fill:'#fff'}),PE.sv('circle',{cx:66,cy:44,r:2,fill:'#fff'}));
  s.append(PE.sv('path',{d:mood==='wow'?'M38 66 Q50 82 62 66 Z':'M36 64 Q50 78 64 64',fill:mood==='wow'?'#FF5A87':'none',stroke:'#1D1B4B','stroke-width':5,'stroke-linecap':'round','stroke-linejoin':'round'}));
  s.append(PE.sv('path',{d:'M30 20 L50 6 L70 20 Z',fill:'#7B5CFF',stroke:'#1D1B4B','stroke-width':5,'stroke-linejoin':'round'}));
  s.append(PE.sv('circle',{cx:50,cy:6,r:5,fill:'#FF5A87',stroke:'#1D1B4B','stroke-width':3}));
  return s;
};
PE.say=function(text){return el('div',{class:'say'},PE.dot(52),el('div',{class:'bubble',html:text}));};

/* ---------- storage ---------- */
const KEY='popexplorers_v1';
const S=PE.state={done:{},name:''};
try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.done)Object.assign(S,o);}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- generic activities ---------- */
PE.acts.sort=function(root,api,cfg){
  const items=PE.shuffle(cfg.items);let i=0,score=0,first=true,lock=false;
  const prog=el('div',{class:'meta'});
  const card=el('div',{class:'sortcard'});
  const fb=el('div',{class:'fb',role:'status','aria-live':'polite'});
  const bx=el('div',{class:'buckets'},cfg.buckets.map(b=>el('button',{class:'bucket',onclick:()=>pick(b.k)},el('span',{class:'be'},b.e||''),b.label)));
  root.append(prog,card,bx,fb);
  function show(){
    lock=false;first=true;
    if(i>=items.length){card.textContent='All sorted! First-try score: '+score+' out of '+items.length+'.';bx.remove();fb.textContent='';prog.textContent='';api.done();return;}
    prog.textContent='Item '+(i+1)+' of '+items.length;card.textContent=items[i].t;fb.textContent='';fb.className='fb';
  }
  function pick(k){
    if(lock)return;const it=items[i];
    if(k===it.k){if(first)score++;lock=true;fb.className='fb good';fb.textContent='✅ '+(it.w||'Yes!');i++;setTimeout(show,1300);}
    else{first=false;fb.className='fb bad';fb.textContent='Not quite. '+(it.h||'Try a different box.');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');}
  }
  show();
};
PE.acts.order=function(root,api,cfg){
  const its=cfg.items.map((x,idx)=>typeof x==='string'?{t:x,idx}:{t:x.t,y:x.y,idx});
  let next=0;
  const fb=el('div',{class:'fb',role:'status','aria-live':'polite'});
  const list=el('ol',{class:'orderlist','aria-label':'Your order so far'});
  const pool=el('div',{class:'chips'});
  PE.shuffle(its).forEach(o=>{
    const b=el('button',{class:'chip',onclick:()=>{
      if(o.idx===next){list.append(el('li',null,(o.y?o.y+': ':'')+o.t));b.remove();next++;fb.className='fb good';fb.textContent='✅ Yes! What came next?';
        if(next===its.length){fb.textContent='🎉 Perfect order!';api.done();}}
      else{fb.className='fb bad';fb.textContent='Hmm, that one does not come next. Think about what must happen first.';b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');}
    }},o.t);pool.append(b);
  });
  root.append(el('p',null,cfg.prompt||'Tap the cards in the right order, first to last.'),list,pool,fb);
};
PE.acts.quizgym=function(root,api){
  const all=[];PE.missions.forEach(m=>(m.words||[]).forEach(w=>all.push(w)));
  const picks=PE.shuffle(all).slice(0,6);let i=0,sc=0;
  const box=el('div');root.append(box);
  function show(){
    box.innerHTML='';
    if(i>=picks.length){box.append(el('p',{class:'fb good'},'Glossary Gym done! '+sc+' of '+picks.length+' right.'));api.done();return;}
    const w=picks[i];const wrong=PE.shuffle(all.filter(x=>x[0]!==w[0])).slice(0,2);
    const opts=PE.shuffle([w].concat(wrong));
    box.append(el('p',null,'Word '+(i+1)+' of '+picks.length+': what does ',el('b',null,w[0]),' mean?'));

PE.acts.capture=function(root,api){

  const holder=el('div'),note=el('p');
  root.prepend(el('p',null,'Three age boxes: ',el('b',null,'Young (0–24)'),', ',el('b',null,'Adults (25–49)'),', ',el('b',null,'Grandparents (50–74)'),'. Every 25 years everyone moves up one box. Adults have babies, some people die, some people move in. That is the ',el('b',null,'cohort-component method'),'.'));

    const dB=d[1];h.sick=r()<(dB<80?0.8:dB<130?0.25:0.04);});

  function inArea(h,i){return h.near===i;}

    svg.append(sv('rect',{x:0,y:0,width:W,height:H,fill:'#E8F7E8',opacity:.5}));

  function choose(i){
    const counts=pumps.map((_,k)=>houses.filter(h=>h.near===k&&h.sick).length);
    if(i===1){fb.className='fb good';fb.textContent='✅ Pump B! '+counts[1]+' sick homes live closest to it, against '+counts[0]+' for Pump A and '+counts[2]+' for Pump C. Snow’s map was one of the first uses of what we now call GIS.';api.done();}
    else{fb.className='fb bad';fb.textContent=pumps[i].n+' only has '+counts[i]+' sick homes near it. Turn on the sick-homes layer and look for the crowd.';}
  }
  draw();
};
})();
(function(){
const M=window.PE.missions;
M.push({id:'m01',zone:1,emoji:'🔍',title:'What is demography?',ch:'Chapter 1 · Introduction',badge:'Pattern Spotter',
cards:[
['🧩','People make patterns','One person’s life is hard to predict. But when you add up <b>thousands of births, deaths and moves</b>, clear patterns appear. <b>Demography</b> is the science of those patterns in human populations.','Weather is the same! You can’t say if it will rain on <i>your</i> head, but you can say how many rainy days a month will have.'],
['❓','Four big questions','Demographers ask: <b>How many people are there?</b> (size) <b>Where do they live?</b> (distribution) <b>What are they like?</b> (age, boys and girls, jobs, school…) And <b>how and why is it changing?</b> (births, deaths, moving).'],
['🇬🇭','Ghana is our classroom','All through this course we use real numbers from Ghana. For example, Ghana’s <b>2021 Population and Housing Census</b> counted <b>30,832,019 people</b>, up from 24,658,823 in 2010.'],
['🗺️','Your map of this course','The book has four parts. <b>Part 1</b> (Chapters 2–10): size, place and who people are. <b>Part 2</b> (Chapters 11–19): the things that change a population. <b>Part 3</b> (Chapters 20–22): estimates and projections. <b>Part 4</b>: a toolbox, a glossary and a time line.'],
['🚲','Momentum','A population is like a rolling bike. Today’s babies become tomorrow’s parents, so the past, present and future are tightly linked. And many countries have kept records for generations, so demographers have lots of clues.']
],
words:[['Demography','The scientific study of human populations: their size, where they live, who they are, and how they change.'],['Population','All the people who live in a particular place, such as a village, a country or the whole world.'],['Rate','A count compared with the size of a group, for example deaths per 1,000 people. It lets us compare big and small places fairly.'],['Ratio','One number divided by another, such as boys per 100 girls.']],
act:{title:'Which question is it?',intro:'Each card is something a demographer might want to know. Tap the box it belongs to.',type:'sort',cfg:{

items:[{t:'How many people live in Ghana? (The 2021 census said 30,832,019.)',k:'size',w:'Total headcount is population size.'},{t:'Which of Ghana’s 16 regions has the most people?',k:'where',w:'That is about where people live.'},{t:'How many people are kids and how many are grandparents?',k:'who',w:'Age is part of “who” people are.'},{t:'How many babies are born in Ghana in one year?',k:'change',w:'Births are one cause of change.'},{t:'Do more Ghanaians live in towns or in villages?',k:'where',w:'City versus village is distribution.'},{t:'Are there more girls or boys?',k:'who',w:'Sex is part of “who” people are.'},{t:'How many people moved from the Northern Region to Accra?',k:'change',w:'Moving is another cause of change.'},{t:'What is the total number of people in Kumasi?',k:'size',w:'The total is population size.'}]}},
quiz:[{q:'Why can demographers find patterns even though nobody can predict one person’s life?',o:['Because adding up many people’s events shows clear patterns','Because they ask everyone for their plans','Because people never change their minds','Because computers can read minds'],a:0,w:'Individual events are unpredictable, but patterns emerge when many records are combined.'},{q:'Which of these is NOT one of the big demography questions?',o:['How many people are there?','Where do they live?','What is the best-tasting food?','How and why is the population changing?'],a:2,w:'Food taste is not a demography question. Size, place, composition and change are.'},{q:'What does “momentum” mean for a population?',o:['Babies today become the parents of tomorrow, linking past and future','Populations always grow quickly','People move fast','Counts never change'],a:0,w:'Population processes link the present with the past and the future in measurable ways.'},{q:'Ghana’s 2021 census counted 30,832,019 people. Which big question does that number answer?',o:['How many people are there? (size)','Where do people live?','Who are the people?','How fast is it changing?'],a:0,w:'A total headcount is population size.'}],

M.push({id:'m02',zone:1,emoji:'📚',title:'Where do the numbers come from?',ch:'Chapter 2 · Basic Sources of Statistics',badge:'Data Detective',
cards:[
['🏠','The census','A <b>census</b> tries to count <b>everyone</b> in a country at about the same time, usually every few years (often every 10). It gives us the big picture, even for tiny places. Ghana’s <b>2021 Population and Housing Census</b> was the sixth since independence.'],
['📝','Surveys','A <b>survey</b> asks questions to a smaller <b>sample</b> of people chosen carefully. It is faster and cheaper than a census, and good for detailed topics like health or jobs. Ghana’s <b>2022 Demographic and Health Survey</b> (the seventh since 1988) asked a sample of households about births, children and health, and 98% of the women approached took part.'],
['📜','Registration and records','Some numbers are written down as events happen: <b>vital statistics</b> are records of births, deaths and marriages. <b>Administrative records</b> (school lists, tax files…) were made for other reasons but can help too.'],
['🕵️','Be a data detective','<b>Primary</b> data is what you collect yourself (costly but exactly what you need). <b>Secondary</b> data was collected by someone else (cheap, but made for another purpose). Always ask: <b>Is it valid</b> (measures what it says)? <b>Reliable</b> (measured the same way each time)? Is <b>privacy</b> protected? Avoid mystery numbers with no source.','Anyone can post statistics online. A good detective checks who made them and how.']
],
words:[['Census','A count of all the people in a country at one time, with questions about each person.'],['Survey','A study that asks questions to a sample, a smaller group chosen to stand for everyone.'],['Vital statistics','Records of births, deaths, marriages and divorces.'],['Primary data','Information collected by the person who will use it.'],['Secondary data','Information that was collected by someone else and is used again.'],['Validity','Whether numbers really measure what they claim to measure.'],['Reliability','Whether numbers are measured consistently.']],
act:{title:'Pick the source',intro:'Which kind of data source is each clue describing?',type:'sort',cfg:{
buckets:[{k:'census',e:'🏠',label:'Census'},{k:'survey',e:'📝',label:'Survey'},{k:'reg',e:'📜',label:'Birth and death registration'},{k:'admin',e:'🗂️',label:'Admin records'}],
items:[{t:'Visits every household in Ghana during the 2021 census',k:'census',w:'Counting everyone is a census.'},{t:'The Ghana Demographic and Health Survey asks chosen households about children and health',k:'survey',w:'A chosen sample is a survey.'},{t:'A hospital reports each new baby to a government office',k:'reg',w:'Recording births as they happen is registration.'},{t:'A school’s list of enrolled students',k:'admin',w:'Made for running the school, but useful for counting kids.'},{t:'Every death certificate signed in a year',k:'reg',w:'Deaths recorded as they happen are vital statistics.'},{t:'A monthly poll of 3,000 people about their jobs',k:'survey',w:'A repeated sample is a survey.'}]}},
quiz:[{q:'What is the main difference between a census and a survey?',o:['A census tries to count everyone; a survey asks a sample','A survey counts everyone; a census asks a sample','They are exactly the same','A census only counts animals'],a:0,w:'Censuses aim at everyone. Surveys use a sample.'},{q:'You use numbers that another agency collected for a different purpose. These are…',o:['Secondary data','Primary data','Fake data','Private data'],a:0,w:'Secondary data was collected by someone else, often for another purpose.'},{q:'A website gives population numbers but says nothing about how they were made. What should you do?',o:['Be careful and check the source before using them','Use them straight away','Add more numbers to them','Delete the website'],a:0,w:'Verify the origin and methods before trusting statistics.'},{q:'Which of these is a survey?',o:['The 2022 Ghana Demographic and Health Survey','The 2021 Population and Housing Census','A school’s enrollment list','A death certificate'],a:0,w:'It interviews a sample of households. The census tries to count everyone.'}],
take:'Detective skills unlocked! Now let’s see how a census actually happens.'});

M.push({id:'m03',zone:1,emoji:'🧑‍💼',title:'Census day!',ch:'Chapter 3 · Collection and Processing of Demographic Data',badge:'Census Captain',
cards:[
['📏','Four rules of a real census','A true census (1) lists <b>each person individually</b>, (2) covers <b>everyone</b> in the area, (3) counts people <b>at about the same time</b>, and (4) is <b>repeated regularly</b>. Experts call these individual enumeration, universality, simultaneity and periodicity.'],
['🧮','Why individual counts matter','Old censuses sometimes just tallied “men, women, children” in each family. You cannot learn much from that. If you write down each person’s age, sex and more, you can mix those facts later, like asking “how many girls aged 6 go to school?”'],
['🇬🇭','Ghana’s digital census','Ghana’s <b>2021 Population and Housing Census</b> was its first <b>fully digital</b> census. Counting ran from 28 June to 11 July 2021. It was a <b>de facto</b> census: people were counted where they were.'],
['🛠️','Before, during and after','<b>Before:</b> plan, draw maps, test the questions, hire and train counters. <b>During:</b> visit every home. <b>After:</b> check forms for mistakes (editing), add them up into tables, publish. Many countries also check whom they missed.'],
['🐣','Vital registration','Births and deaths are recorded by law in many places. This only works if people <b>report</b> them. If reporting is optional, some events are missed, so the records are incomplete.','Surveys work differently: they use random sampling, where every person has a known chance of being picked.']
],
words:[['Enumeration','The act of counting and listing people one by one.'],['Universality','Covering every person in the area, with nobody left out.'],['Simultaneity','Counting everyone as of the same time, so no one is counted twice or missed.'],['Sampling','Choosing a smaller group to study so it represents the whole.'],['Editing','Checking collected forms for mistakes or missing answers and fixing them.']],
act:{title:'Run a census in the right order',intro:'A census has to happen in the right order. Tap the steps from first to last.',type:'order',cfg:{items:['Plan the census and draw the maps','Test the questions and train the counters','Visit every home and count the people','Check the forms for mistakes and fix them','Add everything up into tables','Publish the results for everyone']}},
quiz:[{q:'Why is it important that a census counts everyone at about the same time?',o:['So people are not missed or counted twice as they move around','So it is more exciting','So it costs more','So nobody has to answer'],a:0,w:'Simultaneity prevents people being counted twice or missed.'},{q:'What is the problem with just tallying “men, women and children” per family?',o:['You cannot mix characteristics later, like age and school','It is too slow','It uses too much paper','Nothing is wrong'],a:0,w:'Group tallies cannot be cross-classified, so tabulation is just summation.'},{q:'What happens if birth registration is voluntary?',o:['Some births are missed, so records are incomplete','All births are recorded perfectly','Nobody is born','The census is wrong'],a:0,w:'When registration is voluntary rather than required, completeness suffers.'},{q:'What was special about Ghana’s 2021 census?',o:['It was Ghana’s first fully digital census','It counted only cities','It was done only by phone','It counted only adults'],a:0,w:'The 2021 PHC was the first fully digital census in Ghana.'}],
take:'Census Captain, reporting for duty! Next: how do we know the total headcount is right?'});

M.push({id:'m04',zone:1,emoji:'🧮',title:'How many people are here?',ch:'Chapter 4 · Population Size',badge:'Headcount Hero',
cards:[
['🔢','Size comes first','The <b>size of a population</b> is usually the first thing a government wants to know. Long ago, counts were for taxes and armies, so women, children and some groups were often left out. Modern censuses try to include everyone.'],
['🏠','Who counts as “here”?','<b>De facto:</b> count everyone who is <b>physically present</b> on census night. <b>De jure:</b> count people who <b>belong</b> to the place by usual or legal residence. Most censuses in Africa, Asia and South America are de facto; the United States uses de jure. For a whole country the difference is small, but for towns it can be big. Ghana’s 2021 census was a de facto count.'],
['🫥','Missed and double-counted','Even good censuses <b>miss some people</b> (undercount) and count a few twice (overcount). To measure this, agencies do a <b>post-enumeration survey</b>: a second, independent count of a sample, then they match people one by one.'],
['🐟','The fish trick','If you tag 40 fish, mix them back, and later catch 40 fish and find 10 tagged, then tagged fish are 1/4 of the pond. So the pond has about 160 fish. Demographers use this “<b>dual-system estimation</b>”: N = (people in count 1 × people in count 2) ÷ people found in both.','The trick only works if both counts are independent, like two nets thrown separately.']
],
words:[['De facto','A count of people who are physically present in an area at the census time.'],['De jure','A count of people who belong to an area by legal or usual residence.'],['Undercount','Missing people who should have been counted.'],['Post-enumeration survey','A second independent count of a sample, matched with the census to measure mistakes.'],['Dual-system estimation','Estimating a total by matching two independent counts, like tag-and-recapture.']],
act:{title:'Tag and recapture the pond',intro:'Estimate how many fish are in the pond without counting them all.',type:'capture'},
quiz:[{q:'You tag 40 fish. Later you catch 40 fish and 8 are tagged. About how many fish are in the pond?',o:['200','80','320','48'],a:0,w:'40 × 40 ÷ 8 = 200.'},{q:'Ghana’s 2021 census was de facto. A visitor from Tamale is sleeping in Accra on census night. Where is the visitor counted?',o:['In Accra, where they are','In Tamale, where they usually live','In both places','Nowhere'],a:0,w:'A de facto census counts people where they are at the census time.'},{q:'What is a post-enumeration survey for?',o:['To check how many people the census missed or double-counted','To count animals','To print the results','To replace the census'],a:0,w:'It is an independent check used to estimate coverage errors.'}],
take:'You can now estimate a hidden total with tags and nets. That is real demography!'});

M.push({id:'m05',zone:1,emoji:'🗺️',title:'Where do people live?',ch:'Chapter 5 · Population Distribution: Geographic Areas',badge:'Map Master',
cards:[
['🏘️','Crowded and empty places','In most countries people are not spread out evenly. Some places are packed, others almost empty. Planners, businesses and governments need numbers for <b>regions and neighbourhoods</b>, not just for the whole country. In Ghana there were <b>103 people per km²</b> in 2010 and <b>129</b> in 2021.'],
['🧱','Countries have pieces','Ghana has <b>16 regions</b> (it had 10 until 2019) and <b>261 districts</b>. Greater Accra is the smallest region by area, yet in 2021 it became the most populous with <b>5,455,692</b> people, just ahead of Ashanti (5,440,463). Region sizes vary hugely around the world: the book notes about 1,355 people on average per division in the Cook Islands versus 37.7 million in China.'],
['🏙️','Cities are bigger than their borders','People live in a city but may work in the next town. A <b>metropolitan area</b> groups a central city with the places closely tied to it by commuting and trade.'],
['⚖️','Balance point and density','<b>Density</b> is people per square kilometre (or mile). The <b>center of population</b> is the balance point of a map if every person were a little equal weight. It moves over time as people move.']
],
words:[['Civil division','An official piece of a country, like a province, region, district or state.'],['Metropolitan area','A big city together with nearby places that are closely linked to it.'],['Population density','The number of people per unit of land area.'],['Center of population','The balance point of the map if every person were a weight.']],
act:{title:'Find the center of population',intro:'Where would this island balance?',type:'centerpin'},
quiz:[{q:'Population density tells us…',o:['How many people live per unit of area','How old people are','How many babies are born','Which country is richest'],a:0,w:'Density is population divided by area.'},{q:'Which region became Ghana’s most populous in the 2021 census?',o:['Greater Accra','Ashanti','Northern','Volta'],a:0,w:'Greater Accra had 5,455,692 people, just ahead of Ashanti with 5,440,463.'},{q:'What pulls the center of population toward a place?',o:['Lots of people living there','Having a big park','Being near the sea','Having a long name'],a:0,w:'The center is weighted by the number of people, so crowded places pull harder.'},{q:'Ghana’s density rose from 103 to 129 people per km² between 2010 and 2021. What does that mean?',o:['More people live on each square kilometre, on average','Ghana got bigger','Fewer people live in Ghana','Nothing changed'],a:0,w:'Density is people divided by land area, so it rises when the population grows.'}],
take:'You can find the balance point of a nation. Not bad for a 10-year-old!'});

M.push({id:'m06',zone:1,emoji:'🏙️',title:'City or countryside?',ch:'Chapter 6 · Population Distribution: Classification of Residence',badge:'Urban Expert',
cards:[
['🏡','Urban and rural','Statisticians sort places into <b>urban</b> (city-like) and <b>rural</b> (countryside). But there is no single rule. Countries use size, density, the kinds of jobs people do, or whether a place has a local government.'],
['🔀','Same word, different rule','Ghana calls a locality <b>urban</b> when it has <b>5,000 or more people</b>. By that rule 50.9% of Ghanaians (12.5 million) were urban in 2010 and <b>56.7%</b> (17,472,530 people) in 2021. Other countries use other rules: about 96% of Kuwait’s people count as urban but only about 17.6% in Papua New Guinea. And when the United States changed its definition in 1950, its urban population for that year jumped from 90.1 million to 96.8 million with no one moving at all!','Rural is often just “whatever is not urban”.'],
['📊','Size classes','Towns can be sorted by size. In India between 1981 and 1991, the biggest class (100,000 people or more) grew by about 47%, adding nearly 45 million people.'],
['📐','Measuring how spread out we are','Demographers use measures like the <b>concentration index (Gini)</b> to show how unevenly people are spread, the <b>index of dissimilarity</b> to compare two groups’ spread, and the <b>rank-size rule</b> (the 2nd biggest city is often about half the size of the biggest).']
],
words:[['Urban','Places classed as city-like. The exact rule differs from country to country.'],['Rural','Places that are not urban, such as countryside and small villages.'],['Size class','A group of places of similar population size.'],['Concentration','How unevenly people are spread over places.'],['Gini ratio','A number that measures how unequal a spread is. 0 means perfectly even.']],
act:{title:'Move the urban line',intro:'See how the “percent urban” changes when only the rule changes.',type:'threshold'},
quiz:[{q:'Country A calls a place urban at 2,500 people. Country B uses 20,000. Which statement is likely true?',o:['Country A will report a higher percent urban for the same places','Country B will report a higher percent urban','They will always match','Neither can have urban places'],a:0,w:'A lower threshold makes more places count as urban.'},{q:'How is “rural” often defined?',o:['Everything that is not urban','Only farms','Places with no people','The biggest cities'],a:0,w:'Rural is often a leftover category.'},{q:'What does a Gini-type concentration measure show?',o:['How unevenly people are spread across places','How tall people are','How fast cities grow','How many schools exist'],a:0,w:'It measures concentration of the population.'},{q:'Ghana’s 2021 census found 17,472,530 urban dwellers out of 30,832,019 people. About what percent is urban?',o:['56.7%','43.3%','17.5%','30.8%'],a:0,w:'17,472,530 ÷ 30,832,019 × 100 ≈ 56.7%. Ghana counts places with 5,000 or more people as urban.'}],
take:'You now know why “percent urban” needs a footnote. Sharp eyes!'});

M.push({id:'m07',zone:1,emoji:'🔺',title:'Age and sex pyramids',ch:'Chapter 7 · Age and Sex Composition',badge:'Pyramid Builder',
cards:[
['🎂','Age and sex are superstars','Almost every demographic question needs age and sex. Schools, hospitals, jobs, voting and food all depend on how many people there are at each age, and of each sex.'],
['⚖️','Boys and girls','The <b>sex ratio</b> is the number of males per 100 females. In Ghana in 2021 there were 15,182,459 males and 15,610,149 females, a sex ratio of about <b>97</b>. (In Venezuela in 1990 it was 99.3.) The <b>masculinity proportion</b> is the share of the population that is male.'],
['🔺','The pyramid','A <b>population pyramid</b> shows males on one side and females on the other, with the youngest at the bottom. A wide bottom means many children. Almost straight sides mean a steady population. A wide top means an older population. Wars and baby booms leave bumps and dents.'],
['🧒🧓','Dependency ratio','Children and older people usually depend on working-age people. The <b>dependency ratio</b> is (people under 15 + people 65 and over) ÷ (people 15 to 64) × 100. A <b>median age</b> splits the population in half: half are younger, half are older. Ghana in 2021: <b>35.3%</b> were aged 0–14, <b>60.4%</b> aged 15–64 and <b>4.3%</b> aged 65 and over, a dependency ratio of about <b>66</b>.']
],
words:[['Sex ratio','Males per 100 females.'],['Age pyramid','A graph showing how many people there are at each age, separately for males and females.'],['Dependency ratio','People too young or too old to work, per 100 working-age people.'],['Median age','The age that splits a population in two equal halves.']],
act:{title:'Explore three pyramids',intro:'Tap each country and watch how the shape changes the numbers.',type:'pyramid'},
quiz:[{q:'A pyramid with a very wide bottom and a narrow top tells us the country has…',o:['Many children and fewer older people','Mostly grandparents','Exactly equal ages','No people'],a:0,w:'A wide base means a young population.'},{q:'Ghana in 2021: 15,182,459 males and 15,610,149 females. About what is the sex ratio?',o:['97 males per 100 females','103 males per 100 females','50 males per 100 females','15 males per 100 females'],a:0,w:'15,182,459 ÷ 15,610,149 × 100 ≈ 97.3.'},{q:'20 children, 10 older adults and 60 working-age people. What is the dependency ratio?',o:['50 per 100','30 per 100','20 per 100','100 per 100'],a:0,w:'(20 + 10) ÷ 60 × 100 = 50.'},{q:'Ghana 2021: 10,890,453 children (0–14), 18,619,021 people aged 15–64, and 1,322,545 aged 65+. What is the dependency ratio?',o:['About 66 per 100','About 35 per 100','About 4 per 100','About 100 per 100'],a:0,w:'(10,890,453 + 1,322,545) ÷ 18,619,021 × 100 ≈ 65.6.'}],
take:'You can read a country’s age story from one picture. Next, let’s catch people fibbing about age!'});

M.push({id:'m08',zone:1,emoji:'🕵️',title:'The age-heaping detective',ch:'Chapter 7 · Age and Sex Composition (checking the data)',badge:'Age Detective',
cards:[
['🔟','People love round numbers','When asked their age, many people say numbers ending in <b>0 or 5</b> (like 30 or 35). Others guess or do not know their birthday. This pile-up is called <b>age heaping</b> or <b>digit preference</b>.'],
['⚠️','Why it matters','Age is used in nearly everything: death rates, birth rates, school plans, population projections. If ages are wrong, many results are wrong too.'],
['🔧','Detective tools','<b>Whipple’s index</b> checks how often ages end in 0 or 5. <b>Myers’ blended index</b> checks all ten ending digits. Demographers also use accuracy indexes (like the UN age-sex index) and look for a zigzag pattern in the pyramid.'],
['🩹','Fixing it','Smoothing methods spread out the heaps. Unknown ages are shared out in proportion to known ones. And census counts are compared with births, deaths and other data to see what is missing at each age.']
],
words:[['Age heaping','Too many people reporting ages that end in the same digits, such as 0 and 5.'],['Digit preference','A habit of favouring certain last digits when reporting a number.'],['Whipple’s index','A measure of how much ages ending in 0 or 5 are over-reported.'],['Myers’ index','A measure of preference for each ending digit from 0 to 9.']],
act:{title:'Catch the suspicious ages',intro:'Find the ages with suspiciously tall bars.',type:'heaping'},
quiz:[{q:'What is age heaping?',o:['Too many people reporting ages ending in 0 or 5','People growing taller','A very big family','A census error in counting homes'],a:0,w:'Digit preference piles people at round ages.'},{q:'If ages are honest, about what share of people should report an age ending in 0 or 5?',o:['About 20%','About 50%','About 90%','About 2%'],a:0,w:'Two of ten ending digits is one-fifth, or 20%.'},{q:'Why do demographers worry about wrong ages?',o:['Almost every measure uses age','Ages are secret','Nobody uses age','It makes pyramids colourful'],a:0,w:'Rates, projections and plans all depend on correct ages.'}],
take:'Detective badge earned! You can spot a fibbing pyramid.'});

M.push({id:'m09',zone:1,emoji:'🌈',title:'Who decides who we are?',ch:'Chapter 8 · Racial and Ethnic Composition',badge:'Fair Counter',
cards:[
['🗣️','People describe themselves','In many censuses, people choose the group or groups they belong to. This is called <b>self-identification</b>. It is more respectful than having a counter decide for them.'],
['🔄','Categories are made by societies','The list of groups on a form is designed by a society and it <b>changes over time</b>. Some countries ask about “origin” in a separate question, and some now let people tick <b>more than one</b> group.'],
['🧬','Other ways to describe a population','Besides group identity, censuses ask about <b>ancestry</b>, <b>language</b> spoken (mother tongue), <b>country of birth</b> (foreign-born), and <b>citizenship</b>. Together they describe how diverse a country is. Ghana’s 2021 census asked about topics such as <b>ethnicity</b>, <b>religion</b> and <b>place of birth</b>.'],
['📝','Wording matters','How a question is worded, which choices appear, and whether you can pick more than one can all change the results. So demographers write careful rules for combining or comparing categories, especially across different census years.']
],
words:[['Self-identification','People answering questions about their own group instead of someone else deciding.'],['Ancestry','The origins of a person’s family, such as the places their ancestors came from.'],['Mother tongue','The language a person first learned at home.'],['Foreign-born','People born in a different country from where they now live.']],
act:{title:'Same people, different form',intro:'Count the same 12 people on two different census forms.',type:'zog'},
quiz:[{q:'Why do the counts change between Form A and Form B?',o:['Because the question lets people choose differently','Because people moved','Because the people changed','Because the bars shrank'],a:0,w:'The question design changes how people can answer, and so the counts.'},{q:'Self-identification means…',o:['People tell the census which group(s) they belong to','The counter guesses','The government decides','Everyone is in one group'],a:0,w:'People describe themselves.'},{q:'Why is comparing group counts across many census years tricky?',o:['Categories and wording can change over time','People forget how to count','Censuses have no groups','Years are different lengths'],a:0,w:'Category lists and question wording change between censuses.'},{q:'Which of these topics did Ghana’s 2021 census ask about?',o:['Ethnicity, religion and place of birth','Favourite colour','Shoe size','Favourite football club'],a:0,w:'Censuses collect characteristics such as ethnicity, religion and birth place.'}],
take:'You know that how we ask changes what we find. That is a big lesson for any scientist!'});

M.push({id:'m10',zone:1,emoji:'💍',title:'Marriage and households',ch:'Chapter 9 · Marriage, Divorce, and Family Groups',badge:'Family Mapper',
cards:[
['👫','Marital status','A census records each person’s <b>marital status</b>: never married, married, widowed or divorced. This tells us a status at one moment. Separately, registration records <b>events</b>: marriages and divorces that happen during a year.'],
['📈','Rates and shares','Demographers compute rates such as marriages per 1,000 people, and shares such as the <b>percentage never married</b> by age group. Later marriage shows up as a higher “never married” share at young adult ages.'],
['🏠','Household or family?','A <b>household</b> is everybody who lives together in one housing unit, related or not. A <b>family</b> is a group related by blood, marriage or adoption. Some people live in <b>group quarters</b> such as dorms, barracks or care homes.'],
['🇬🇭','Ghana’s shrinking households','The average household in Ghana had <b>4.4</b> people in 2010 and <b>3.6</b> in 2021. Urban households fell from 4.1 to 3.3 people and rural ones from 5.0 to 4.0.'],
['📏','Definitions change','Countries define families and households differently, and definitions can change from one census to the next. That limits how well we can compare over time and across countries.']
],
words:[['Marital status','Whether a person is never married, married, widowed or divorced.'],['Nuptiality','Marriage patterns in a population: how many marry, and when.'],['Household','All the people living together in one home.'],['Family','People in a household who are related by blood, marriage or adoption.'],['Group quarters','Places such as dorms or nursing homes where many unrelated people live.']],
act:{title:'Household, family, or group quarters?',intro:'Sort each living arrangement.',type:'sort',cfg:{
buckets:[{k:'hh',e:'🏠',label:'Household, not a family'},{k:'fam',e:'👨‍👩‍👧',label:'Family household'},{k:'gq',e:'🏫',label:'Group quarters'}],
items:[{t:'Two friends share an apartment',k:'hh',w:'They share a home but are not related.'},{t:'Mum, dad and two children live together',k:'fam',w:'Related people in one home form a family household.'},{t:'A grandmother lives alone',k:'hh',w:'She is a one-person household. One person is not a family.'},{t:'Students living in a university dorm',k:'gq',w:'Dorms are group quarters.'},{t:'An aunt and her nephew share a house',k:'fam',w:'They are related by family ties.'},{t:'Residents of a nursing home',k:'gq',w:'Care homes are group quarters.'},{t:'A married couple with no children',k:'fam',w:'A married couple is a family.'}]}},
quiz:[{q:'Two unrelated roommates share a flat. What is this?',o:['A household but not a family','A family','Group quarters','A census'],a:0,w:'They live in one housing unit but are not related.'},{q:'A census says 30% of people aged 25–29 have “never married”. Which kind of fact is this?',o:['Marital STATUS at one point in time','A marriage EVENT','A birth rate','A death rate'],a:0,w:'Status counts people in a category at the census date.'},{q:'Why can family statistics be hard to compare across countries?',o:['Definitions of family and household differ','Families are the same everywhere','Countries do not have families','Only names differ'],a:0,w:'Definitions differ and change over time.'},{q:'Ghana’s average household size fell from 4.4 (2010) to 3.6 (2021). By how many people?',o:['0.8','1.8','8','0.08'],a:0,w:'4.4 − 3.6 = 0.8 fewer people per household, on average.'}],
take:'Family Mapper! You can tell the difference between a house, a household and a family.'});

M.push({id:'m11',zone:1,emoji:'🎓',title:'School, work and money',ch:'Chapter 10 · Educational and Economic Characteristics',badge:'Work Whiz',
cards:[
['📖','Education numbers','<b>Literacy</b> asks if a person can read and write. <b>School enrollment</b> asks who is attending school. <b>Educational attainment</b> asks the highest level someone completed. Each tells a different story.'],
['👷','The labor force','The <b>labor force</b> = people who are <b>employed</b> + people who are <b>unemployed</b> (without a job but looking for one). People not working and not looking, such as students, retirees and full-time caregivers, are <b>not in the labor force</b>. Ghana had 18,619,021 people of working age (15–64) in 2021, or 60.4% of the population.','Unemployed does not mean “no job”. It means no job AND looking for one.'],
['🧰','What kind of work?','<b>Occupation</b> is the kind of work someone does (teacher, driver). <b>Industry</b> is what the business does (education, transport). Countries use standard lists to classify both.'],
['💰','Money and poverty','Censuses and surveys also measure <b>income</b>, <b>wealth</b> (assets such as a home) and <b>poverty</b>: families whose resources fall below a <b>poverty line</b> needed to buy basics. Ratios compare working people to those who depend on them.']
],
words:[['Literacy','The ability to read and write.'],['School enrollment','Being signed up and attending school.'],['Educational attainment','The highest level of schooling a person has completed.'],['Labor force','People who are working or actively looking for work.'],['Poverty line','An income level below which a family cannot afford basic needs.']],
act:{title:'Who is in the labor force?',intro:'Sort each person into the right box.',type:'sort',cfg:{
buckets:[{k:'emp',e:'🛠️',label:'Employed'},{k:'unemp',e:'🔎',label:'Unemployed (looking)'},{k:'out',e:'🏠',label:'Not in labor force'}],
items:[{t:'Efia bakes bread at a bakery full-time',k:'emp',w:'She has a job.'},{t:'Kofi has no job and applies for work every day',k:'unemp',w:'No job, but actively looking: unemployed.'},{t:'Akua, 12, is a full-time student',k:'out',w:'Children and students are not in the labor force.'},{t:'Mr. Boateng, 70, is retired',k:'out',w:'Retired people are not working or looking.'},{t:'Abena works part-time as a cashier',k:'emp',w:'Part-time work still counts as employed.'},{t:'Esi looks after her young children at home full-time',k:'out',w:'Unpaid home care is outside the labor force definition.'},{t:'Yaw lost his job last month and is interviewing',k:'unemp',w:'He is without work and searching.'}]}},
quiz:[{q:'There are 60 employed and 10 unemployed people. What is the labor force?',o:['70','60','10','50'],a:0,w:'Labor force = employed + unemployed = 70.'},{q:'Which asks “What is the highest grade you finished?”',o:['Educational attainment','School enrollment','Literacy','Occupation'],a:0,w:'Attainment is the highest level completed.'},{q:'What is a poverty line?',o:['A level of resources below which basic needs cannot be met','A line on a map','The richest people','A school rule'],a:0,w:'It is a threshold for the resources needed to buy necessities.'},{q:'Ghana had 18,619,021 people aged 15–64 in 2021, out of 30,832,019. What share is that?',o:['About 60%','About 35%','About 4%','About 90%'],a:0,w:'18,619,021 ÷ 30,832,019 × 100 ≈ 60.4%.'}],
take:'Zone 1 done! You can count a country, place it on a map and describe who lives there. Now: why does the number keep changing?'});
